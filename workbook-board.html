<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Workbook Board</title>
<!--
  WORKBOOK BOARD — v1
  A teacher's modelling whiteboard whose pages match student workbooks (A4, ruled / dotted thirds / grid).
  Single file, no dependencies, no server. Organised into numbered sections so it can be split into
  modules later (e.g. when moving to a Vite project for offline/PWA support).

  Sections (search for "== n."):
   1. CONFIG        constants: page size, colours, sizes, templates
   2. STATE         app state + page model
   3. STORAGE       IndexedDB auto-save, file save/open
   4. PAGE ENGINE   layout/scaling + template drawing
   5. INK           stroke rendering
   6. INPUT         pointer handling: pen, mouse, touch, palm rejection, eraser
   7. HISTORY       undo / redo / clear
   8. PAGES         add / delete / navigate / paper settings
   9. EXPORT        PNG + print-to-PDF
  10. UI            toolbars, popovers, present mode, keyboard
  11. INIT

  All ink and template geometry is stored in millimetres on a 210 x 297 page,
  so it scales to any screen and exports at true A4 size.
-->
<style>
:root{
  --desk:#e5e0d6; --rail:#faf8f4; --rail-line:#dcd6ca; --hover:#efebe3;
  --ink:#26231e; --muted:#766f63; --accent:#2b59cf; --accent-soft:#e2e9fb; --danger:#bf3a3a;
  --rail-w:84px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--ink);
  font:13px/1.35 "Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:var(--rail-w) 1fr var(--rail-w);height:100%}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 0;overflow-y:auto;scrollbar-width:none;z-index:2}
.rail::-webkit-scrollbar{display:none}
.rail.left{border-right:1px solid var(--rail-line)}
.rail.right{border-left:1px solid var(--rail-line)}
.sep{width:44px;height:1px;background:var(--rail-line);margin:7px 0;flex:none}
.grow{flex:1 1 auto;min-height:8px}

.btn{width:70px;min-height:52px;border:0;background:transparent;border-radius:12px;padding:4px 2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;cursor:pointer;flex:none;touch-action:manipulation}
.btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:var(--hover)}
.btn.on{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.3;cursor:default;background:transparent}
.pagelabel{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 0;color:var(--ink)}

.swatches{display:grid;grid-template-columns:repeat(2,32px);gap:8px;padding:2px 0;transition:opacity .15s}
.swatches.dim{opacity:.4}
.swatch{width:32px;height:32px;border-radius:50%;border:0;padding:0;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);touch-action:manipulation}
.swatch.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),0 0 0 3px var(--rail),0 0 0 5px var(--accent)}
.sizes{display:flex;gap:2px}
.size{width:25px;height:42px;border:0;background:transparent;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.size:hover{background:var(--hover)}
.size.on{background:var(--accent-soft)}
.size i{display:block;border-radius:50%;background:var(--ink)}
.size.on i{background:var(--accent)}
.size.ring i{background:transparent;border:2px solid var(--ink)}
.size.ring.on i{border-color:var(--accent)}

/* ---------- stage + page ---------- */
#stage{position:relative;overflow:auto;touch-action:none;background:var(--desk);scrollbar-width:thin}
#stage.fit{overflow:hidden}
#pagewrap{padding:24px 0}
#sheet{position:relative;margin:0 auto;background:#fff;
  box-shadow:0 1px 2px rgba(40,30,10,.14),0 8px 28px rgba(40,30,10,.13)}
#sheet canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ink{mix-blend-mode:multiply}           /* highlighter shows template lines through it */
#stage.erasing{cursor:none}
#stage:not(.erasing){cursor:crosshair}
#ecursor{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;display:none;
  border:1.5px solid rgba(40,40,40,.7);background:rgba(255,255,255,.35);box-shadow:0 0 0 1px rgba(255,255,255,.8)}

/* ---------- popovers ---------- */
.pop{position:fixed;right:calc(var(--rail-w) + 10px);width:310px;background:#fff;border-radius:16px;
  box-shadow:0 2px 6px rgba(0,0,0,.1),0 16px 40px rgba(0,0,0,.16);padding:16px;display:none;z-index:10}
.pop.open{display:block}
.pop h3{margin:0 0 12px;font-size:14px;font-weight:600}
.tpls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tpl{border:0;background:transparent;padding:4px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:5px;font-size:11px;touch-action:manipulation}
.tpl canvas{width:56px;height:79px;border-radius:2px;box-shadow:0 0 0 1px #d8d3c8}
.tpl.on{background:var(--accent-soft);color:var(--accent)}
.tpl.on canvas{box-shadow:0 0 0 2px var(--accent)}
.field{display:block;margin:4px 0 14px}
.field .row{display:flex;justify-content:space-between;margin-bottom:6px}
.field b{font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:32px;margin:0;accent-color:var(--accent);touch-action:manipulation}
.note{font-size:12px;color:var(--muted);margin:0 0 12px}
.wide{width:100%;border:1px solid var(--rail-line);background:var(--rail);border-radius:10px;padding:11px;
  cursor:pointer;touch-action:manipulation}
.wide:hover{background:var(--hover)}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;
  padding:11px 10px;border-radius:10px;cursor:pointer;font-size:14px;touch-action:manipulation}
.menu-item:hover{background:var(--hover)}
.menu-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu-item.danger{color:var(--danger)}
.pop hr{border:0;border-top:1px solid #ebe6dc;margin:8px 0}
.setting{padding:8px 10px}
.setting .lbl{font-size:14px;margin-bottom:7px}
.seg{display:flex;background:#f1eee8;border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:8px;cursor:pointer;font-size:13px;touch-action:manipulation}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}

/* ---------- present mode ---------- */
body.presenting #app{grid-template-columns:1fr}
body.presenting .rail{display:none}
body.presenting #stage{background:#1c1f24}
body.presenting #sheet{box-shadow:none}
#mini{display:none;position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:5;
  flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border-radius:20px;
  background:rgba(34,37,43,.92);color:#ece9e3;max-height:calc(100% - 28px);overflow-y:auto;scrollbar-width:none}
body.presenting #mini{display:flex}
#mini .btn{width:56px;min-height:46px;color:#ece9e3}
#mini .btn:hover{background:rgba(255,255,255,.08)}
#mini .btn.on{background:rgba(255,255,255,.16);color:#fff}
#mini .sep{width:36px;background:rgba(255,255,255,.15)}
#mini .swatches{grid-template-columns:repeat(2,22px);gap:7px}
#mini .swatch{width:22px;height:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
#mini .swatch.on{box-shadow:0 0 0 2px #22252b,0 0 0 4px #fff}
#mini .pagelabel{color:#ece9e3;font-size:13px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#2a2d33;color:#fff;
  padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:80vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- print (Print / Save as PDF) ---------- */
#print{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{height:auto;overflow:visible;background:#fff}
  #app,#mini,.pop,#toast{display:none!important}
  #print{display:block}
  #print img{display:block;width:210mm;height:296mm;break-after:page;page-break-after:always}
  #print img:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>

<div id="app">
  <!-- LEFT RAIL: drawing tools -->
  <nav class="rail left" aria-label="Tools">
    <button class="btn" data-tool="pen" title="Pen (P)"><svg viewBox="0 0 24 24"><path d="M4 20l1-4.5L16 4.5l3.5 3.5L8.5 19z"/><path d="M14 7l3.5 3.5"/></svg>Pen</button>
    <button class="btn" data-tool="hl" title="Highlighter (H)"><svg viewBox="0 0 24 24"><path d="M14.5 4.5l5 5-8 8H7v-4.5z"/><path d="M7 17.5L4.5 20H10"/></svg>Highlight</button>
    <button class="btn" data-tool="eraser" title="Eraser (E) — also the pen's eraser end or side button"><svg viewBox="0 0 24 24"><path d="M8.5 19.5L4 15l9.5-9.5 6 6-8 8z"/><path d="M8.5 19.5H20"/><path d="M9 10l6 6"/></svg>Eraser</button>
    <div class="sep"></div>
    <div class="swatches" data-swatches></div>
    <div class="sep"></div>
    <div class="sizes" id="sizes"></div>
    <div class="sep"></div>
    <button class="btn" data-act="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>Undo</button>
    <button class="btn" data-act="redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg>Redo</button>
    <button class="btn" data-act="clear" title="Clear this page (can be undone)"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7l1 13h9l1-13"/></svg>Clear</button>
  </nav>

  <!-- STAGE: the page -->
  <main id="stage">
    <div id="pagewrap">
      <div id="sheet">
        <canvas id="bg"></canvas>
        <canvas id="ink"></canvas>
        <canvas id="live"></canvas>
        <div id="ecursor"></div>
      </div>
    </div>
  </main>

  <!-- RIGHT RAIL: pages + paper + view -->
  <nav class="rail right" aria-label="Pages">
    <button class="btn" data-act="prev" title="Previous page (↑ / PgUp)"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>Prev</button>
    <div class="pagelabel" data-pagelabel>1 / 1</div>
    <button class="btn" data-act="next" title="Next page (↓ / PgDn)"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>Next</button>
    <button class="btn" data-act="add" title="Add a page after this one"><svg viewBox="0 0 24 24"><path d="M13.5 3H6v18h12V7.5z"/><path d="M12 10v6M9 13h6"/></svg>Add page</button>
    <button class="btn" data-act="delete" title="Delete this page"><svg viewBox="0 0 24 24"><path d="M13.5 3H6v18h12V7.5z"/><path d="M9 13h6"/></svg>Delete</button>
    <div class="sep"></div>
    <button class="btn" id="paperBtn" title="Paper type, line spacing and margin"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M5 8h14M5 12.5h14M5 17h14M9 3v18"/></svg>Paper</button>
    <button class="btn" data-act="view" id="viewBtn" title="Switch between whole page and page width"><svg viewBox="0 0 24 24"><path d="M3 12h18M6.5 8.5L3 12l3.5 3.5M17.5 8.5L21 12l-3.5 3.5"/></svg><span>Fit width</span></button>
    <button class="btn" data-act="present" title="Present full screen (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Present</button>
    <div class="grow"></div>
    <button class="btn" id="menuBtn" title="Save, open, export and settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="18.5" r="1.2"/></svg>More</button>
  </nav>
</div>

<!-- Paper popover (filled by JS) -->
<div class="pop" id="paperPop" role="dialog" aria-label="Paper settings"></div>

<!-- Menu popover -->
<div class="pop" id="menuPop" role="dialog" aria-label="More">
  <button class="menu-item" data-act="saveFile"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></svg>Save notebook to file</button>
  <button class="menu-item" data-act="openFile"><svg viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M5 19h14"/></svg>Open notebook file</button>
  <button class="menu-item" data-act="png"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9.5" r="1.5"/><path d="M20 15.5l-4.5-4.5L6 20"/></svg>Save this page as an image</button>
  <button class="menu-item" data-act="print"><svg viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="7" rx="1.5"/><path d="M7 14h10v6H7z"/></svg>Print or save as PDF</button>
  <hr>
  <div class="setting">
    <div class="lbl">Finger touch</div>
    <div class="seg" id="fingerSeg">
      <button data-finger="auto">Auto</button><button data-finger="scroll">Scroll</button><button data-finger="draw">Draw</button>
    </div>
    <p class="note" id="fingerNote" style="margin:7px 0 0"></p>
  </div>
  <div class="setting">
    <div class="lbl">Pen pressure</div>
    <div class="seg" id="pressureSeg">
      <button data-pressure="on">On</button><button data-pressure="off">Off — even lines</button>
    </div>
  </div>
  <hr>
  <button class="menu-item danger" data-act="newNotebook"><svg viewBox="0 0 24 24"><path d="M13.5 3H6v18h12V7.5z"/><path d="M13.5 3v4.5H18"/></svg>Start a new notebook</button>
  <p class="note" style="margin:6px 10px 0">Your notebook saves automatically in this browser. Save to file to keep a copy or move it to another device.</p>
</div>

<!-- Present-mode mini toolbar -->
<div id="mini" aria-label="Presenting tools">
  <button class="btn" data-tool="pen" title="Pen"><svg viewBox="0 0 24 24"><path d="M4 20l1-4.5L16 4.5l3.5 3.5L8.5 19z"/><path d="M14 7l3.5 3.5"/></svg></button>
  <button class="btn" data-tool="hl" title="Highlighter"><svg viewBox="0 0 24 24"><path d="M14.5 4.5l5 5-8 8H7v-4.5z"/><path d="M7 17.5L4.5 20H10"/></svg></button>
  <button class="btn" data-tool="eraser" title="Eraser"><svg viewBox="0 0 24 24"><path d="M8.5 19.5L4 15l9.5-9.5 6 6-8 8z"/><path d="M8.5 19.5H20"/><path d="M9 10l6 6"/></svg></button>
  <div class="sep"></div>
  <div class="swatches" data-swatches></div>
  <div class="sep"></div>
  <button class="btn" data-act="undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
  <button class="btn" data-act="prev" title="Previous page"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
  <div class="pagelabel" data-pagelabel>1 / 1</div>
  <button class="btn" data-act="next" title="Next page"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <div class="sep"></div>
  <button class="btn" data-act="present" title="Stop presenting (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div id="toast" role="status"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
<div id="print"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* =========================================================================
   == 1. CONFIG
   ========================================================================= */
const PAGE_W = 210, PAGE_H = 297;          // A4, millimetres
const TOP_GAP = 20;                         // mm of space above the first line (heading area)
const PEN_COLOURS = ['#1f1d1a', '#1f4fd1', '#d12f2f', '#1d8a43', '#7a3fc4', '#e2700f'];
const HL_COLOURS  = ['#ffe14d', '#ff9fd0', '#8fefa6', '#8fd2ff', '#ffbb66', '#cfb0ff'];
const PEN_SIZES    = [0.5, 0.9, 1.6];       // stroke width, mm
const HL_SIZES     = [4, 7, 11];            // highlighter width, mm
const ERASER_SIZES = [2.5, 5, 10];          // eraser radius, mm
const HL_ALPHA = 0.45;
const TEMPLATES = {
  ruled:  { label: 'Ruled',  spacing: { min: 5, max: 14, step: 0.5, def: 8,  label: 'Line spacing' }, margin: 25 },
  thirds: { label: 'Thirds', spacing: { min: 4, max: 12, step: 0.5, def: 7,  label: 'Gap between lines' }, margin: 25 },
  grid:   { label: 'Grid',   spacing: { min: 4, max: 20, step: 0.5, def: 10, label: 'Square size' }, margin: 0 },
  blank:  { label: 'Blank',  spacing: null, margin: 0 },
};
const LINE_COL = { ruled: '#9ec3e6', thirds: '#9ec3e6', base: '#6f9fd2', grid: '#b6d0ea', margin: '#e48b8b' };

/* =========================================================================
   == 2. STATE
   ========================================================================= */
const state = {
  pages: [], cur: 0,
  tool: 'pen', penColour: 0, hlColour: 0,
  size: { pen: 1, hl: 1, eraser: 1 },
  view: 'page',          // 'page' = whole page fits, 'width' = page fills width and scrolls
  finger: 'auto',        // 'auto' | 'scroll' | 'draw'
  pressure: true,
  penSeen: false,        // set the first time a stylus is used (drives finger 'auto')
  presenting: false,
};

function makePage(src) {
  const p = {
    tpl: 'ruled',
    spacing: { ruled: TEMPLATES.ruled.spacing.def, thirds: TEMPLATES.thirds.spacing.def, grid: TEMPLATES.grid.spacing.def },
    margin:  { ruled: TEMPLATES.ruled.margin, thirds: TEMPLATES.thirds.margin, grid: TEMPLATES.grid.margin },
    strokes: [], undo: [], redo: [],
  };
  if (src) {
    if (TEMPLATES[src.tpl]) p.tpl = src.tpl;
    for (const k of ['ruled', 'thirds', 'grid']) {
      const t = TEMPLATES[k];
      if (src.spacing && isFinite(src.spacing[k])) p.spacing[k] = clamp(+src.spacing[k], t.spacing.min, t.spacing.max);
      if (src.margin && isFinite(src.margin[k])) p.margin[k] = clamp(+src.margin[k], 0, 60);
    }
  }
  return p;
}
const page = () => state.pages[state.cur];

/* A stroke: { t:'pen'|'hl', c:colour, w:width mm, pr:pressure-on, p:[x,y,pressure, x,y,pressure, ...] } */
function validStroke(s) {
  return s && Array.isArray(s.p) && s.p.length >= 3 && s.p.length % 3 === 0 &&
    typeof s.c === 'string' && isFinite(s.w) && (s.t === 'pen' || s.t === 'hl');
}

/* =========================================================================
   == 3. STORAGE
   ========================================================================= */
const db = {
  h: null,
  async open() {
    try {
      this.h = await new Promise((res, rej) => {
        const r = indexedDB.open('workbook-board', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) { this.h = null; }
    return !!this.h;
  },
  get(k) {
    return new Promise(res => {
      try { const q = this.h.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }
      catch (e) { res(null); }
    });
  },
  set(k, v) {
    return new Promise(res => {
      try {
        const tx = this.h.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(v, k);
        tx.oncomplete = () => res(true); tx.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
};

function serialise() {
  return {
    app: 'workbook-board', version: 1, saved: new Date().toISOString(), cur: state.cur,
    pages: state.pages.map(p => ({ tpl: p.tpl, spacing: { ...p.spacing }, margin: { ...p.margin }, strokes: p.strokes })),
  };
}
function loadNotebook(nb) {
  const raw = nb && Array.isArray(nb.pages) ? nb.pages : [];
  const pages = raw.map(r => { const p = makePage(r); p.strokes = Array.isArray(r.strokes) ? r.strokes.filter(validStroke) : []; return p; });
  if (!pages.length) pages.push(makePage());
  state.pages = pages;
  state.cur = clamp((nb && nb.cur) | 0, 0, pages.length - 1);
}
function prefs() {
  const { tool, penColour, hlColour, size, view, finger, pressure, penSeen } = state;
  return { tool, penColour, hlColour, size, view, finger, pressure, penSeen };
}
function applyPrefs(p) {
  if (!p) return;
  if (['pen', 'hl', 'eraser'].includes(p.tool)) state.tool = p.tool;
  if (p.penColour in PEN_COLOURS) state.penColour = p.penColour | 0;
  if (p.hlColour in HL_COLOURS) state.hlColour = p.hlColour | 0;
  if (p.size) for (const k of ['pen', 'hl', 'eraser']) if (p.size[k] in [0, 1, 2]) state.size[k] = p.size[k] | 0;
  if (['page', 'width'].includes(p.view)) state.view = p.view;
  if (['auto', 'scroll', 'draw'].includes(p.finger)) state.finger = p.finger;
  if (typeof p.pressure === 'boolean') state.pressure = p.pressure;
  state.penSeen = !!p.penSeen;

let saveTimer = 0, saveWarned = false;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 700); }
async function saveNow() {
  clearTimeout(saveTimer);
  if (!db.h) return;
  const ok = await db.set('state', { notebook: serialise(), prefs: prefs() });
  if (!ok && !saveWarned) { saveWarned = true; toast('Auto-save failed — use More › Save notebook to file.'); }
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const dateStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

function saveFile() {
  download(new Blob([JSON.stringify(serialise())], { type: 'application/json' }), `workbook-${dateStr()}.json`);
  toast('Notebook saved to your Downloads.');
}
function openFile(file) {
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); } catch (e) { toast("That file couldn't be read."); return; }
    if (!data || data.app !== 'workbook-board') { toast("That doesn't look like a Workbook Board notebook."); return; }
    if (hasInk() && !confirm('Open this notebook? It will replace the one on screen (save it to file first if you want to keep it).')) return;
    loadNotebook(data);

const hasInk = () => state.pages.some(p => p.strokes.length);

/* =========================================================================
   == 4. PAGE ENGINE — layout + templates
   ========================================================================= */
const stage = $('#stage'), wrap = $('#pagewrap'), sheet = $('#sheet');
const cvBg = $('#bg'), cvInk = $('#ink'), cvLive = $('#live'), ecur = $('#ecursor');
const ctxBg = cvBg.getContext('2d');
const ctxInk = cvInk.getContext('2d');
const ctxLive = cvLive.getContext('2d', { desynchronized: true }); // lower pen latency where supported
const view = { scale: 1, dpr: 1, w: 0, h: 0 };                       // scale = CSS px per mm

function layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (!sw || !sh) return;
  const pad = state.presenting ? 10 : 22;
  const fitPage = state.presenting || state.view === 'page';
  let w = fitPage ? Math.min(sw - pad * 2, (sh - pad * 2) * PAGE_W / PAGE_H) : sw - pad * 2;
  w = Math.max(160, Math.floor(w));
  const h = Math.round(w * PAGE_H / PAGE_W);
  stage.classList.toggle('fit', fitPage);
  sheet.style.width = w + 'px'; sheet.style.height = h + 'px';
  wrap.style.paddingTop = Math.max(pad, Math.floor((sh - h) / 2)) + 'px';
  wrap.style.paddingBottom = pad + 'px';

  // Keep each canvas under ~9 megapixels so large screens stay fast.
  let dpr = window.devicePixelRatio || 1;
  dpr = Math.min(dpr, Math.sqrt(9e6 / (w * h)));
  const changed = w !== view.w || h !== view.h || dpr !== view.dpr;
  view.w = w; view.h = h; view.dpr = dpr; view.scale = w / PAGE_W;
  if (changed) {
    for (const c of [cvBg, cvInk, cvLive]) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  }
  renderBg(); renderInk(); clearLive();
}

function prep(ctx) {           // clear a canvas and set its units to millimetres
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  const k = view.scale * view.dpr;
  ctx.setTransform(k, 0, 0, k, 0, 0);
}
function renderBg() { prep(ctxBg); drawTemplate(ctxBg, page(), view.scale * view.dpr); }
function clearLive() { prep(ctxLive); }

/* Draws a page's paper onto ctx (already in mm units). k = device pixels per mm. */
function drawTemplate(ctx, pg, k) {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, PAGE_W, PAGE_H);
  const t = pg.tpl;
  if (t === 'blank') return;
  const sp = pg.spacing[t], m = pg.margin[t] || 0;
  const hair = Math.max(0.2, 1 / k);                         // never thinner than 1 device pixel
  const snap = v => (Math.round(v * k - 0.5) + 0.5) / k;     // crisp 1px lines
  const hline = (y, x0 = 0, x1 = PAGE_W) => { const yy = snap(y); ctx.moveTo(x0, yy); ctx.lineTo(x1, yy); };

  ctx.lineCap = 'butt';
  if (t === 'ruled') {
    ctx.strokeStyle = LINE_COL.ruled; ctx.lineWidth = hair; ctx.beginPath();
    for (let y = TOP_GAP; y <= PAGE_H - 6; y += sp) hline(y);
    ctx.stroke();
  } else if (t === 'thirds') {
    // Dotted thirds: solid head line, dotted middle line, solid base line, then a descender third.
    const rows = [];
    for (let y = TOP_GAP; y + 2 * sp <= PAGE_H - 6; y += 3 * sp) rows.push(y);
    ctx.strokeStyle = LINE_COL.base; ctx.lineWidth = hair; ctx.beginPath();
    rows.forEach(y => hline(y)); ctx.stroke();
    ctx.strokeStyle = LINE_COL.base; ctx.lineWidth = hair * 1.4; ctx.beginPath();
    rows.forEach(y => hline(y + 2 * sp)); ctx.stroke();
    ctx.strokeStyle = LINE_COL.thirds; ctx.lineWidth = hair * 1.2; ctx.setLineDash([0.9, 1.3]); ctx.beginPath();
    rows.forEach(y => hline(y + sp)); ctx.stroke(); ctx.setLineDash([]);
  } else if (t === 'grid') {
    const ox = (PAGE_W % sp) / 2, oy = (PAGE_H % sp) / 2;
    ctx.strokeStyle = LINE_COL.grid; ctx.lineWidth = hair; ctx.beginPath();
    for (let x = ox; x <= PAGE_W + 0.01; x += sp) { const xx = snap(x); ctx.moveTo(xx, 0); ctx.lineTo(xx, PAGE_H); }
    for (let y = oy; y <= PAGE_H + 0.01; y += sp) hline(y);
    ctx.stroke();
  }
  if (m > 0) {
    ctx.strokeStyle = LINE_COL.margin; ctx.lineWidth = hair * 1.3; ctx.beginPath();
    const xx = snap(m); ctx.moveTo(xx, 0); ctx.lineTo(xx, PAGE_H); ctx.stroke();
  }
}

/* =========================================================================
   == 5. INK — stroke rendering
   Pen strokes are drawn as smoothed quadratic segments through the midpoints of
   the recorded points; each segment takes its width from the pen pressure.
   ========================================================================= */
const wAt = (s, i) => s.pr ? s.w * (0.45 + 1.1 * s.p[i * 3 + 2]) : s.w;

function penStyle(ctx, s) { ctx.strokeStyle = s.c; ctx.fillStyle = s.c; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }

function drawSeg(ctx, s, k) {          // segment ending near point k (k >= 1)
  const p = s.p, cx = p[(k - 1) * 3], cy = p[(k - 1) * 3 + 1];
  const sx = k === 1 ? cx : (p[(k - 2) * 3] + cx) / 2, sy = k === 1 ? cy : (p[(k - 2) * 3 + 1] + cy) / 2;
  const ex = (cx + p[k * 3]) / 2, ey = (cy + p[k * 3 + 1]) / 2;
  ctx.lineWidth = (wAt(s, k - 1) + wAt(s, k)) / 2;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke();
}
function drawTail(ctx, s) {            // last half-segment out to the final point
  const p = s.p, n = p.length / 3;
  if (n < 2) return;
  ctx.lineWidth = wAt(s, n - 1);
  ctx.beginPath();
  ctx.moveTo((p[(n - 2) * 3] + p[(n - 1) * 3]) / 2, (p[(n - 2) * 3 + 1] + p[(n - 1) * 3 + 1]) / 2);
  ctx.lineTo(p[(n - 1) * 3], p[(n - 1) * 3 + 1]); ctx.stroke();
}
function drawDot(ctx, s) {
  ctx.beginPath(); ctx.arc(s.p[0], s.p[1], wAt(s, 0) / 2, 0, Math.PI * 2); ctx.fill();
}
function tracePath(ctx, p) {           // one continuous smoothed path (used for highlighter)
  const n = p.length / 3;
  ctx.beginPath(); ctx.moveTo(p[0], p[1]);
  if (n === 1) { ctx.lineTo(p[0] + 0.01, p[1]); return; }
  for (let k = 1; k < n; k++) {
    const cx = p[(k - 1) * 3], cy = p[(k - 1) * 3 + 1];
    ctx.quadraticCurveTo(cx, cy, (cx + p[k * 3]) / 2, (cy + p[k * 3 + 1]) / 2);
  }
  ctx.lineTo(p[(n - 1) * 3], p[(n - 1) * 3 + 1]);
}
function drawStroke(ctx, s) {

    ctx.strokeStyle = s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    tracePath(ctx, s.p); ctx.stroke();
    ctx.restore();
    return;
  }
  penStyle(ctx, s);
  const n = s.p.length / 3;
  if (n === 1) { drawDot(ctx, s); return; }
  for (let k = 1; k < n; k++) drawSeg(ctx, s, k);
  drawTail(ctx, s);
}
function renderInk() {
  prep(ctxInk);
  for (const s of page().strokes) drawStroke(ctxInk, s);
}

/* =========================================================================
   == 6. INPUT — pen, mouse, touch
   - Pen and mouse draw. The pen's eraser end or side (barrel) button erases.
   - Touch: palms are ignored while the pen is near the screen. Fingers draw until
     a pen has been used ('auto'), then they scroll / swipe pages instead.
   ========================================================================= */
let active = null;          // the current gesture
let lastPen = -1e9;         // time of the last pen event (hover counts)
let sheetRect = null;

  if ((e.pointerType === 'pen' || e.pointerType === 'mouse') && (e.buttons & 2)) return true; // barrel / right button
  return false;
}

stage.addEventListener('pointerdown', e => {
  const now = performance.now();
  if (e.pointerType === 'pen') {
    lastPen = now;
    if (!state.penSeen) { state.penSeen = true; scheduleSave(); updateMenu(); }
  }
  if (active) {

    if (e.pointerType !== 'touch' && active.ptype === 'touch') { clearLive(); active = null; }

  if (e.pointerType === 'touch') {

  capture(e.pointerId);
  const [x, y] = toPage(e);
  if (wantsEraser(e)) {
    active = { id: e.pointerId, ptype: e.pointerType, kind: 'erase', before: page().strokes.slice(), lx: x, ly: y };
    if (eraseAt(x, y)) renderInk();
    showEraser(x, y);
  } else {
    startStroke(e, x, y);
  }
});

stage.addEventListener('pointermove', e => {
  if (e.pointerType === 'pen') lastPen = performance.now();
  if (!active || e.pointerId !== active.id) { hoverCursor(e); return; }
  if (active.kind === 'pan') {
    stage.scrollTop = active.st - (e.clientY - active.y);
    stage.scrollLeft = active.sl - (e.clientX - active.x);
    return;
  }
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
  if (active.kind === 'stroke') {
    const s = active.s;
    if (s.t === 'pen') penStyle(ctxLive, s);
    for (const ev of evs) {
      const [x, y] = toPage(ev);
      if (addPoint(ev, x, y) && s.t === 'pen') drawSeg(ctxLive, s, s.p.length / 3 - 1);
    }
    if (s.t === 'hl') drawHlLive(s);
  } else {
    let removed = false, x, y;
    for (const ev of evs) { [x, y] = toPage(ev); removed = eraseLine(x, y) || removed; }
    if (removed) renderInk();

  }

function endGesture(e) {
  if (!active || e.pointerId !== active.id) return;
  const a = active; active = null;
  if (a.kind === 'pan') {
    // Swipe left/right to change page when the page isn't scrollable.
    const dx = e.clientX - a.x, dy = e.clientY - a.y;
    const scrollable = stage.scrollHeight > stage.clientHeight + 2;
    if (!scrollable && Math.abs(dx) > 90 && Math.abs(dx) > 2 * Math.abs(dy)) goPage(state.cur + (dx < 0 ? 1 : -1));
  } else if (a.kind === 'stroke') {
    commitStroke(a.s);
  } else if (a.kind === 'erase') {
    if (page().strokes.length !== a.before.length) { pushUndo(a.before); scheduleSave(); }

stage.addEventListener('pointerup', endGesture);
stage.addEventListener('pointercancel', endGesture);
stage.addEventListener('pointerleave', e => { if (!active) ecur.style.display = 'none'; });
stage.addEventListener('contextmenu', e => e.preventDefault());

function startStroke(e, x, y) {
  const hl = state.tool === 'hl';
  const s = {
    t: hl ? 'hl' : 'pen',
    c: hl ? HL_COLOURS[state.hlColour] : PEN_COLOURS[state.penColour],
    w: hl ? HL_SIZES[state.size.hl] : PEN_SIZES[state.size.pen],
    pr: !hl && state.pressure && e.pointerType === 'pen',
    p: [],
  };

function addPoint(ev, x, y) {
  const p = active.s.p;
  let pr = ev.pointerType === 'pen' ? (ev.pressure || 0.5) : 0.5;
  if (p.length) {
    const dx = x - p[p.length - 3], dy = y - p[p.length - 2];
    if (dx * dx + dy * dy < 0.0225) return false;               // ignore moves under 0.15 mm
    pr = p[p.length - 1] * 0.65 + pr * 0.35;                    // smooth pressure
  }
  p.push(Math.round(x * 100) / 100, Math.round(y * 100) / 100, Math.round(pr * 100) / 100);
  return true;
}

function drawHlLive(s) {
  clearLive();
  ctxLive.save();
  ctxLive.globalAlpha = HL_ALPHA; ctxLive.strokeStyle = s.c; ctxLive.lineWidth = s.w;
  ctxLive.lineCap = 'round'; ctxLive.lineJoin = 'round';
  tracePath(ctxLive, s.p); ctxLive.stroke();
  ctxLive.restore();
}

function commitStroke(s) {
  clearLive();
  if (!s.p.length) return;
  const pg = page();
  pushUndo(pg.strokes.slice());
  pg.strokes.push(s);
  drawStroke(ctxInk, s);
  scheduleSave();
}

/* --- eraser: removes whole strokes it touches --- */
const bbCache = new WeakMap();
function bbox(s) {
  let b = bbCache.get(s);
  if (!b) {

    for (let i = 0; i < s.p.length; i += 3) {
      const x = s.p[i], y = s.p[i + 1];
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    b = [x0 - s.w, y0 - s.w, x1 + s.w, y1 + s.w]; bbCache.set(s, b);
  }

}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
function hits(s, x, y, r) {
  const b = bbox(s);
  if (x < b[0] - r || x > b[2] + r || y < b[1] - r || y > b[3] + r) return false;
  const p = s.p, n = p.length / 3, rr = r + s.w / 2;
  if (n === 1) return Math.hypot(p[0] - x, p[1] - y) <= rr;
  for (let i = 1; i < n; i++) if (segDist(x, y, p[i * 3 - 3], p[i * 3 - 2], p[i * 3], p[i * 3 + 1]) <= rr) return true;

}
function eraseAt(x, y) {
  const pg = page(), r = ERASER_SIZES[state.size.eraser];

  pg.strokes = keep;

}
function eraseLine(x, y) {           // fill in fast swipes so nothing is skipped
  const a = active, r = ERASER_SIZES[state.size.eraser];
  const steps = Math.max(1, Math.ceil(Math.hypot(x - a.lx, y - a.ly) / (r * 0.5)));
  let removed = false;
  for (let i = 1; i <= steps; i++) removed = eraseAt(a.lx + (x - a.lx) * i / steps, a.ly + (y - a.ly) * i / steps) || removed;

}
function showEraser(x, y) {
  const rp = ERASER_SIZES[state.size.eraser] * view.scale;
  ecur.style.display = 'block';
  ecur.style.width = ecur.style.height = rp * 2 + 'px';
  ecur.style.transform = `translate(${x * view.scale - rp}px, ${y * view.scale - rp}px)`;

function hoverCursor(e) {
  if (e.pointerType === 'touch') return;
  const eraserish = state.tool === 'eraser' || (e.pointerType === 'pen' && (e.buttons & 32));
  if (!eraserish) { ecur.style.display = 'none'; return; }

/* =========================================================================
   == 7. HISTORY — each page has its own undo/redo stack of stroke lists
   ========================================================================= */
const MAX_UNDO = 150;
function pushUndo(before) {
  const pg = page();
  pg.undo.push(before);
  if (pg.undo.length > MAX_UNDO) pg.undo.shift();
  pg.redo = [];
  updateUndo();
}
function undo() {
  const pg = page(); if (!pg.undo.length) return;
  pg.redo.push(pg.strokes); pg.strokes = pg.undo.pop();
  renderInk(); updateUndo(); scheduleSave();
}
function redo() {
  const pg = page(); if (!pg.redo.length) return;
  pg.undo.push(pg.strokes); pg.strokes = pg.redo.pop();
  renderInk(); updateUndo(); scheduleSave();
}
function clearPage() {
  const pg = page(); if (!pg.strokes.length) return;
  pushUndo(pg.strokes); pg.strokes = [];
  renderInk(); scheduleSave();
  toast('Page cleared — press Undo to bring it back.');
}

/* =========================================================================
   == 8. PAGES
   ========================================================================= */
function goPage(i, force) {
  i = clamp(i, 0, state.pages.length - 1);
  if (i === state.cur && !force) return;
  state.cur = i;
  stage.scrollTop = 0;
  renderBg(); renderInk(); clearLive();
  updatePageUI(); updateUndo();
  if ($('#paperPop').classList.contains('open')) renderPaperPop();
  scheduleSave();
}
function addPage() {
  state.pages.splice(state.cur + 1, 0, makePage(page()));     // new page copies this page's paper
  goPage(state.cur + 1, true);
}
function deletePage() {
  if (state.pages.length < 2) return;
  if (page().strokes.length && !confirm(`Delete page ${state.cur + 1}? This can't be undone.`)) return;
  state.pages.splice(state.cur, 1);
  goPage(Math.min(state.cur, state.pages.length - 1), true);
}
function setTemplate(t) {
  page().tpl = t; renderBg(); renderPaperPop(); scheduleSave();
}
function applyPaperToAll() {
  const src = page();
  state.pages.forEach(p => { p.tpl = src.tpl; p.spacing = { ...src.spacing }; p.margin = { ...src.margin }; });
  toast(`Paper applied to all ${state.pages.length} pages.`);
  scheduleSave();
}

/* =========================================================================
   == 9. EXPORT
   ========================================================================= */
function renderPageCanvas(pg, pxPerMm) {
  const c = document.createElement('canvas');
  c.width = Math.round(PAGE_W * pxPerMm); c.height = Math.round(PAGE_H * pxPerMm);
  const ctx = c.getContext('2d');
  ctx.setTransform(pxPerMm, 0, 0, pxPerMm, 0, 0);
  drawTemplate(ctx, pg, pxPerMm);
  for (const s of pg.strokes) drawStroke(ctx, s);
  return c;
}
function exportPng() {
  renderPageCanvas(page(), 8).toBlob(b => {                     // ~200 dpi
    if (!b) { toast("Couldn't create the image."); return; }
    download(b, `workbook-${dateStr()}-p${state.cur + 1}.png`);
    toast('Page saved as an image.');
  }, 'image/png');
}
async function printAll() {
  const box = $('#print'); box.innerHTML = '';
  toast('Preparing pages…');
  for (const pg of state.pages) {
    const img = new Image();
    img.src = renderPageCanvas(pg, 6).toDataURL('image/jpeg', 0.92);   // ~150 dpi
    box.appendChild(img);
    try { await img.decode(); } catch (e) {}
  }
  closePops();
  setTimeout(() => window.print(), 50);
}
window.addEventListener('afterprint', () => { $('#print').innerHTML = ''; });

/* =========================================================================
   == 10. UI
   ========================================================================= */
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function buildSwatches() {
  $$('[data-swatches]').forEach(box => {
    box.innerHTML = PEN_COLOURS.map((_, i) => `<button class="swatch" data-colour="${i}" aria-label="Colour ${i + 1}"></button>`).join('');
  });
}
function renderTools() {
  $$('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === state.tool));
  const hl = state.tool === 'hl', er = state.tool === 'eraser';
  const cols = hl ? HL_COLOURS : PEN_COLOURS, ci = hl ? state.hlColour : state.penColour;
  $$('[data-swatches]').forEach(box => {
    box.classList.toggle('dim', er);
    box.querySelectorAll('.swatch').forEach((sw, i) => { sw.style.background = cols[i]; sw.classList.toggle('on', !er && i === ci); });
  });
  const dots = er ? [9, 14, 21] : hl ? [8, 12, 17] : [5, 9, 14];
  $('#sizes').innerHTML = dots.map((d, i) =>
    `<button class="size${er ? ' ring' : ''}${state.size[state.tool] === i ? ' on' : ''}" data-size="${i}" aria-label="Size ${i + 1}"><i style="width:${d}px;height:${d}px"></i></button>`).join('');
  stage.classList.toggle('erasing', er);
  if (!er) ecur.style.display = 'none';
}
function setTool(t) { state.tool = t; renderTools(); scheduleSave(); }

function updateUndo() {
  const pg = page();
  $$('[data-act="undo"]').forEach(b => b.disabled = !pg.undo.length);
  $$('[data-act="redo"]').forEach(b => b.disabled = !pg.redo.length);
}
function updatePageUI() {
  const n = state.pages.length;
  $$('[data-pagelabel]').forEach(l => l.textContent = `${state.cur + 1} / ${n}`);
  $$('[data-act="prev"]').forEach(b => b.disabled = state.cur === 0);
  $$('[data-act="next"]').forEach(b => b.disabled = state.cur === n - 1);
  $$('[data-act="delete"]').forEach(b => b.disabled = n < 2);
}
function updateViewBtn() {
  $('#viewBtn span').textContent = state.view === 'page' ? 'Fit width' : 'Fit page';
}

/* --- popovers --- */
let openPop = null, openBtn = null;
function showPop(pop, btn) {
  if (openPop === pop) { closePops(); return; }
  closePops();
  pop.classList.add('open'); btn.classList.add('on');
  const r = btn.getBoundingClientRect();
  pop.style.top = Math.max(10, Math.min(r.top - 8, innerHeight - pop.offsetHeight - 10)) + 'px';
  openPop = pop; openBtn = btn;
}
function closePops() {
  if (openPop) { openPop.classList.remove('open'); openBtn.classList.remove('on'); }
  openPop = openBtn = null;
}
document.addEventListener('pointerdown', e => {
  if (openPop && !openPop.contains(e.target) && !openBtn.contains(e.target)) closePops();
}, true);

/* --- paper popover --- */
const PREVIEW = { ruled: 14, thirds: 9, grid: 15 };
function renderPaperPop() {
  const pop = $('#paperPop'), pg = page(), t = pg.tpl, T = TEMPLATES[t];
  pop.innerHTML = `
    <h3>Paper — page ${state.cur + 1}</h3>
    <div class="tpls">${Object.keys(TEMPLATES).map(k =>
      `<button class="tpl${k === t ? ' on' : ''}" data-tpl="${k}"><canvas data-preview="${k}"></canvas>${TEMPLATES[k].label}</button>`).join('')}</div>
    ${T.spacing ? `
      <label class="field"><span class="row"><span>${T.spacing.label}</span><b id="spVal">${pg.spacing[t]} mm</b></span>
        <input type="range" id="spIn" min="${T.spacing.min}" max="${T.spacing.max}" step="${T.spacing.step}" value="${pg.spacing[t]}"></label>
      <label class="field"><span class="row"><span>Margin</span><b id="mgVal">${pg.margin[t] ? pg.margin[t] + ' mm' : 'None'}</b></span>
        <input type="range" id="mgIn" min="0" max="40" step="1" value="${pg.margin[t]}"></label>
      ${t === 'thirds' ? '<p class="note">Each row: solid top line, dotted middle line, solid base line, then a space for tails.</p>' : ''}`
      : '<p class="note">A plain page with no lines.</p>'}
    <button class="wide" data-act="applyAll">Use this paper on all pages</button>`;
  // Mini previews (exaggerated spacing so the pattern reads at thumbnail size)
  pop.querySelectorAll('[data-preview]').forEach(c => {
    const dpr = window.devicePixelRatio || 1, k = 56 / PAGE_W * dpr;
    c.width = Math.round(56 * dpr); c.height = Math.round(79 * dpr);
    const ctx = c.getContext('2d'); ctx.setTransform(k, 0, 0, k, 0, 0);
    const fake = makePage(); fake.tpl = c.dataset.preview;
    fake.spacing = { ...PREVIEW }; fake.margin = { ruled: 34, thirds: 34, grid: 0 };
    drawTemplate(ctx, fake, k);
  });
  const sp = pop.querySelector('#spIn'), mg = pop.querySelector('#mgIn');
  if (sp) sp.oninput = () => { pg.spacing[t] = +sp.value; pop.querySelector('#spVal').textContent = sp.value + ' mm'; renderBg(); scheduleSave(); };
  if (mg) mg.oninput = () => { pg.margin[t] = +mg.value; pop.querySelector('#mgVal').textContent = +mg.value ? mg.value + ' mm' : 'None'; renderBg(); scheduleSave(); };
}

/* --- menu popover --- */
function updateMenu() {
  $$('#fingerSeg button').forEach(b => b.classList.toggle('on', b.dataset.finger === state.finger));
  $$('#pressureSeg button').forEach(b => b.classList.toggle('on', (b.dataset.pressure === 'on') === state.pressure));
  $('#fingerNote').textContent = {
    auto: state.penSeen ? 'Pen detected: fingers scroll and swipe between pages.' : 'Fingers draw until you use the pen, then they scroll.',
    scroll: 'Fingers scroll the page and swipe between pages.',
    draw: 'Fingers draw. (Palms are still ignored while the pen is near.)',
  }[state.finger];
}

/* --- present mode --- */
let presentFs = false;
async function togglePresent() {
  closePops();
  state.presenting = !state.presenting;
  document.body.classList.toggle('presenting', state.presenting);
  if (state.presenting) {
    try { if (document.documentElement.requestFullscreen) { await document.documentElement.requestFullscreen(); presentFs = true; } } catch (e) { presentFs = false; }
  } else if (document.fullscreenElement) {
    presentFs = false;
    try { await document.exitFullscreen(); } catch (e) {}
  }
  layout();
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && presentFs && state.presenting) { presentFs = false; togglePresent(); }
});

/* --- one click handler for every button --- */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tool) return setTool(b.dataset.tool);
  if (b.dataset.colour != null) {
    const i = +b.dataset.colour;
    if (state.tool === 'hl') state.hlColour = i;
    else { state.penColour = i; state.tool = 'pen'; }
    renderTools(); scheduleSave(); return;
  }
  if (b.dataset.size != null) { state.size[state.tool] = +b.dataset.size; renderTools(); scheduleSave(); return; }
  if (b.dataset.tpl) return setTemplate(b.dataset.tpl);
  if (b.dataset.finger) { state.finger = b.dataset.finger; updateMenu(); scheduleSave(); return; }
  if (b.dataset.pressure) { state.pressure = b.dataset.pressure === 'on'; updateMenu(); scheduleSave(); return; }
  if (b.id === 'paperBtn') { if (openPop !== $('#paperPop')) renderPaperPop(); showPop($('#paperPop'), b); return; }
  if (b.id === 'menuBtn') { updateMenu(); showPop($('#menuPop'), b); return; }
  switch (b.dataset.act) {
    case 'undo': return undo();
    case 'redo': return redo();
    case 'clear': return clearPage();
    case 'prev': return goPage(state.cur - 1);
    case 'next': return goPage(state.cur + 1);
    case 'add': return addPage();
    case 'delete': return deletePage();
    case 'applyAll': return applyPaperToAll();
    case 'view': state.view = state.view === 'page' ? 'width' : 'page'; updateViewBtn(); stage.scrollTop = 0; layout(); scheduleSave(); return;
    case 'present': return togglePresent();
    case 'saveFile': closePops(); return saveFile();
    case 'openFile': closePops(); return $('#fileInput').click();
    case 'png': closePops(); return exportPng();
    case 'print': return printAll();
    case 'newNotebook':
      closePops();
      if (hasInk() && !confirm('Start a new notebook? The current one will be cleared from this browser (save it to file first to keep it).')) return;
      loadNotebook(null); goPage(0, true); saveNow(); toast('New notebook started.');
      return;
  }
});
$('#fileInput').addEventListener('change', e => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ''; });

/* --- keyboard --- */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const ctrl = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (ctrl && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (ctrl && k === 'y') { e.preventDefault(); redo(); return; }
  if (ctrl && k === 's') { e.preventDefault(); saveFile(); return; }
  if (ctrl || e.altKey) return;
  if (k === 'p') setTool('pen');
  else if (k === 'h') setTool('hl');
  else if (k === 'e') setTool('eraser');
  else if (k === 'f') togglePresent();
  else if (k === 'arrowdown' || k === 'pagedown' || (k === 'arrowright' && !e.shiftKey)) { e.preventDefault(); goPage(state.cur + 1); }
  else if (k === 'arrowup' || k === 'pageup' || k === 'arrowleft') { e.preventDefault(); goPage(state.cur - 1); }
  else if (k === 'escape') { if (openPop) closePops(); else if (state.presenting) togglePresent(); }
});

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
document.addEventListener('selectstart', e => { if (e.target.tagName !== 'INPUT') e.preventDefault(); });

/* =========================================================================
   == 11. INIT
   ========================================================================= */
(async function init() {
  buildSwatches();
  const ok = await db.open();
  const saved = ok ? await db.get('state') : null;
  if (saved && saved.notebook) { loadNotebook(saved.notebook); applyPrefs(saved.prefs); }
  else loadNotebook(null);
  if (!ok) toast("Auto-save isn't available here — use More › Save notebook to file.");
  renderTools(); updatePageUI(); updateUndo(); updateViewBtn();
  layout();
  new ResizeObserver(() => requestAnimationFrame(layout)).observe(stage);
  window.__wb = { state, page, undo, redo, goPage, addPage, setTemplate, layout }; // handy for testing
})();
</script>
</body>
